<script>
var D={
entry:{name:'Entry points',sub:'Where work enters the harness',
 how:['Authenticate the caller and resolve the user, tenant, and session (thread) ids','Normalize the input (text, files, events) into one message format','Attach metadata: channel, locale, permissions, the agent config to use','Route the request to a run, a queue, or a scheduled job'],
 design:['Sync chat vs. async background jobs vs. scheduled runs','What to do when a user sends again mid-run: reject, queue, interrupt, or roll back','Rate limits and quotas per user and per tenant','Mark every external payload as trusted or untrusted at the door'],
 risks:[['Spoofed identity','verify auth at the edge, never trust ids in the message body'],['Floods and abuse','rate limits, quotas, concurrency caps'],['Malicious payloads in emails, webhooks, uploads','tag them as untrusted data before they reach the context']]},
ctx:{name:'Context assembly',sub:'Build exactly what the model sees this turn',
 how:['Load the system instructions and policies first','Recall memory: fetch the user profile and run a semantic search in the user’s namespace','List skills by name and description; load a skill’s full text only if it’s relevant','Add tool specs, then recent history, trimmed to the token budget'],
 design:['A token budget per section: instructions, memory, skills, tools, history','A stable prefix first, so prompt caching cuts cost and latency','Clearly separate trusted instructions from untrusted data with tags or delimiters','Retrieve the top few relevant items, not everything'],
 risks:[['Context rot from stuffing too much','budgets, top-k retrieval, progressive loading'],['Indirect prompt injection hidden in documents or web pages','wrap retrieved content as data, never as instructions'],['Stale or wrong memories','timestamps, recency weighting, source tracking']]},
model:{name:'Model',sub:'Reason over the context and choose the next move',
 how:['Receive the assembled context','Reason, then produce either a final answer or tool calls','Return tool-call arguments as structured JSON','The harness validates arguments against each tool’s schema'],
 design:['Keep the provider swappable behind one interface','Route easy steps to small, fast models and hard steps to large ones','Low temperature for tool use; structured output for decisions','A fallback model and retries with backoff for outages'],
 risks:[['Hallucinated or malformed tool arguments','schema validation, return the error to the model, retry'],['Jailbreak attempts','instruction hierarchy, the model’s safety training, plus input guardrails'],['Provider outage or rate limits','fallback models, retries, request queuing']]},
ctrl:{name:'Loop controller',sub:'Decide whether to act again or stop',
 how:['Read the model’s output: tool calls or a final answer','Update the plan or todo list and record progress','Check stop conditions: task done, step limit, token or cost budget, time limit','Dispatch the next action, or hand the final answer to output checks'],
 design:['An explicit plan for long tasks that the model can revise','Hard budgets: max steps, tokens, cost, wall-clock time','Retry policy that feeds errors back to the model','A verifier step before declaring the task complete'],
 risks:[['Infinite loops','step caps and repeated-call detection'],['Stopping too early','completion checks against the plan, or a verifier pass'],['Runaway cost','hard budget limits with a kill switch']]},
guard:{name:'Guardrails',sub:'Three checkpoints: input, action, output',
 how:['Input: screen for jailbreaks, prompt injection, PII, and policy violations before the content reaches the model','Action: check every tool call against permissions; high-risk calls pause for a human to approve, edit, or reject','Output: validate the format, filter unsafe content, redact secrets and personal data','Log every block and approval for audit'],
 design:['Least privilege: each agent gets only the tools and scopes it needs','Allowlists for domains, shell commands, and file paths','Risk tiers: reads run automatically, writes need confirmation, irreversible actions always need a human','Layer rules, classifiers, and model judgment, since no single check is enough'],
 risks:[['Jailbreaks and role-play tricks','input classifiers, and system policy that always outranks user text'],['Prompt injection inside tool results or web pages','treat results as data; content can never grant new permissions; confirm sensitive actions'],['Data exfiltration','network egress allowlists, no secrets in the context'],['Blocking legitimate requests','track false positives in evals and tune thresholds']]},
act:{name:'Action layer',sub:'Where the agent actually does things',
 how:['Tools and MCP: validated arguments → call the API → result returned with the matching call id','Code execution: run in a sandbox with CPU, memory, and time limits, and no network by default','Filesystem: route each path to a backend, like scratch space, durable storage, or a real workspace','Sub-agents: hand off a task with a fresh context and get back only a summary (sync, async, or scripted fan-out)'],
 design:['Fewer, well-described tools beat many vague ones','Timeouts, retries, and idempotent tools wherever possible','Run independent calls in parallel','Use sub-agents to keep heavy work out of the main context'],
 risks:[['Destructive actions','dry runs, confirmation, backups, undo'],['Sandbox escape or host damage','isolated containers or VMs, never the host disk in production'],['Tool sprawl confusing the model','curate tools, group them, load them on demand']]},
cm:{name:'Context management',sub:'Keep the window small and useful on long tasks',
 how:['Count tokens on every turn','Offload large tool results to files, keeping a reference and a short preview','Summarize older turns when nearing the limit, keeping recent turns word for word','Isolate heavy subtasks in sub-agents so only results come back'],
 design:['Thresholds: offload above N tokens, summarize at a set share of the window','Structured summaries: goal, decisions, open questions, key facts','Re-read offloaded files on demand instead of keeping them in context','Retrieval beats raw dumps'],
 risks:[['A critical detail lost in a summary','keep the originals in files and re-read them when needed'],['Summary drift over many compressions','structured summaries that carry decisions forward explicitly'],['Agent forgets offloaded content exists','leave clear references and file paths in context']]},
state:{name:'State and memory',sub:'Short-term state per session, long-term memory across sessions',
 how:['Short-term: checkpoint after every step, keyed by session id, so runs can pause, resume, replay, and fork','Long-term write: the agent saves during the run (hot path), or a background job extracts memories afterward','Store each item by namespace (user, team) and key, with a timestamp and its source','Index items with embeddings; the next run recalls the top matches into context','Merge or patch existing items instead of duplicating; expire stale ones'],
 design:['Memory types: semantic (facts, profile), episodic (past runs, examples), procedural (instructions, skills)','Shape: one profile document vs. a collection of many items','Scratch paths vs. durable paths for files','Storage: Postgres with vectors, or a dedicated vector store'],
 risks:[['Memory poisoning: injected text saved as a “fact”','only save from trusted sources, validate writes, review high-impact memories'],['Leaks between users','a namespace per user and access checks on every read'],['Privacy and retention','let users view and delete memories; set retention limits'],['Bloat and contradictions','dedupe, merge, prefer recent']]},
loop:{name:'The inner loop',sub:'Repeat until the job is done',
 how:['Each turn rebuilds the context with the latest results and memory','The model decides the next step; the controller checks budgets and progress','Guardrails gate every action; results are compressed and checkpointed','The loop ends on a final answer, a stop condition, or a human interrupt'],
 design:['Typical tasks take a handful to dozens of turns','Checkpoint every turn so a crash resumes instead of restarting','Stream progress so users see what’s happening'],
 risks:[['Error compounding over many turns','verify intermediate results, keep plans explicit'],['Context growing every turn','offload, summarize, delegate'],['Users left waiting','stream steps and allow interrupting']]},
out:{name:'Outputs',sub:'Deliver results safely',
 how:['The final answer passes the output guardrails','Format it: text, schema-validated JSON, or files','Stream it progressively to the user or caller','Log real-world actions with who, what, and when'],
 design:['Stream tokens plus progress events','Cite sources for factual claims','Structured output for downstream systems'],
 risks:[['Wrong or unsafe content','output checks and a verifier pass'],['Leaking secrets or personal data','redaction before anything leaves'],['Irreversible actions','confirmation plus an audit trail']]},
obs:{name:'Observe and evaluate',sub:'Know whether it’s working, and why not',
 how:['Trace every model call and tool call with inputs, outputs, latency, tokens, and cost','Offline evals: test sets with expected outcomes, run on every change','Online evals: sample production traces and score them with LLM judges and human review','Collect user feedback: ratings and corrections'],
 design:['Trace ids linked to session and user','Dashboards for cost, latency, and error rates','Regression gates before deploying','Red-team sets for jailbreaks and prompt injection'],
 risks:[['Silent regressions','evals in CI and before each release'],['Biased LLM judges','calibrate them against human labels'],['Sensitive data in logs','redact traces and restrict access']]},
improve:{name:'The outer loop: improve',sub:'Feedback flows back into the context sources',
 how:['Turn each failure into a new eval case','Update instructions, skills, and tool descriptions','Refine what gets remembered and how it’s recalled','Ship changes as versioned configs that can be rolled back'],
 design:['Version prompts, skills, and tool sets like code','A/B test changes on real traffic','Let the agent propose memory and skill updates, with review'],
 risks:[['Fixing one case breaks others','rerun the full eval suite on every change'],['Self-modifying agents drifting','human review for changes to instructions and skills']]},
rt:{name:'Runtime',sub:'Run reliably, at scale, for a long time',
 how:['Durable execution: each step is checkpointed, so a crash resumes instead of restarting','Task queues and workers handle long and background runs','Concurrency control per session handles users sending messages mid-run','Deploy as a versioned service and scale workers horizontally'],
 design:['A database for state and memory, a queue or stream for jobs and events','Timeouts, heartbeats, and cancellation for every run','Secrets kept in a vault and injected at run time','Isolation per tenant'],
 risks:[['Lost work on a crash','durable checkpoints'],['Hung runs','timeouts and cancellation'],['Leaked secrets','never put them in prompts, context, or logs']]},
instr:{name:'Instructions',sub:'The standing orders: role, rules, policies',
 how:['Write the role, goals, and rules once, as the system prompt','Put non-negotiable policy first, so it outranks anything that comes later','Add per-user or per-team preferences recalled from memory','Keep it stable across turns so it can be cached'],
 design:['Short and specific beats long and vague','Separate fixed policy from user-editable preferences','Version instructions like code, with tests'],
 risks:[['Users trying to override the rules','an instruction hierarchy where system policy always wins'],['Instructions growing into a wall of text','move detailed procedures into skills'],['Conflicting rules','review them and test against eval cases']]},
mem:{name:'Memory recall',sub:'Bring the right memories into this turn',
 how:['Build a search query from the current request','Search the user’s namespace by meaning (embeddings) and by exact keys','Rank by relevance and recency, keep only the top few','Insert them as clearly labeled data, with their dates and sources'],
 design:['A profile loaded every time; collection items retrieved on demand','A fixed budget, such as the top five items','Give the agent a memory search tool for deeper digs'],
 risks:[['Irrelevant recalls distracting the model','relevance thresholds and a small top-k'],['Another user’s memories showing up','always filter by the caller’s namespace'],['Outdated facts','prefer recent items and show their dates']]},
skills:{name:'Skills',sub:'On-demand know-how for specific tasks',
 how:['Each skill is a folder with a SKILL.md: a short header plus detailed steps','Only skill names and descriptions sit in context by default','When a task matches, the agent reads the full skill file','Once loaded, the full text stays in this conversation'],
 design:['One skill per workflow or domain','Descriptions that say exactly when to use the skill','Skills can bundle scripts, templates, and examples'],
 risks:[['A skill that never gets used','sharpen its description and test triggering in evals'],['Overlapping skills confusing the choice','merge or narrow them'],['Untrusted third-party skills','review them first, since they act like instructions']]},
toolspec:{name:'Tool specs',sub:'Tell the model what it can do',
 how:['Each tool has a name, a description, and an argument schema','Only tools allowed for this user and task are included','Large tool sets are filtered or loaded on demand','MCP servers supply specs for tools in external systems'],
 design:['Name tools by intent; say when to use them and when not to','Small, typed argument schemas','Group related tools and hide rarely used ones'],
 risks:[['The model picks the wrong tool','clearer descriptions and fewer overlapping tools'],['A malicious MCP server with poisoned descriptions','vet servers and treat their text as untrusted'],['Too many tools wasting context','select tools dynamically per task']]},
hist:{name:'History',sub:'The conversation so far',
 how:['Load the session’s messages from the latest checkpoint','Keep the most recent turns word for word','Replace older turns with a running summary','Offload bulky tool outputs, keeping short references'],
 design:['A token budget for history','Never separate a tool call from its result','Pin key messages, such as the original goal'],
 risks:[['Losing sight of the original goal','pin it, or restate it in every summary'],['Broken tool-call pairs after trimming','trim only on turn boundaries']]},
tools:{name:'Tools and MCP',sub:'Call functions and external systems',
 how:['The model emits a tool call with JSON arguments','The harness validates the arguments against the schema','Permissions are checked, then the function or API runs with a timeout','The result returns with the matching call id, truncated or offloaded if large'],
 design:['Idempotent tools wherever possible, so retries are safe','Error messages the model can act on','Parallel calls for independent lookups'],
 risks:[['Tool results carrying injected instructions','treat output as data; it can’t trigger privileged actions'],['Hanging calls','timeouts and circuit breakers'],['Credential misuse','scoped, short-lived tokens per user']]},
code:{name:'Code execution',sub:'Run code safely',
 how:['The agent writes a script or an interpreter snippet','It runs in an isolated sandbox with CPU, memory, and time limits','The harness captures output, errors, and files produced','A summary and file references go back to the model'],
 design:['A container or microVM per session','No network by default; allowlist when needed','An interpreter for quick logic, a full sandbox for real workloads'],
 risks:[['Escaping to the host','strong isolation; never run on the host in production'],['Resource abuse','limits and monitoring'],['Data exfiltration through code','network egress controls']]},
fs:{name:'Filesystem',sub:'The agent’s working space',
 how:['The agent uses file tools: list, read, write, edit, search','A router maps each path prefix to a storage backend','Scratch paths vanish with the session, durable paths persist, workspace paths hit real files','Large results are written here instead of into the context'],
 design:['Clear conventions for where memories, drafts, and outputs go','Virtual roots so the agent can’t escape its folder','Separate storage per user'],
 risks:[['Writing outside the allowed area','path allowlists and virtual roots'],['Overwriting important files','versioning and confirmation for deletes'],['Saving memories to a scratch path','spell out the conventions in the instructions']]},
sub:{name:'Sub-agents',sub:'Delegate work with a clean context',
 how:['The main agent calls a delegate tool with a task and a target sub-agent','The sub-agent runs with its own fresh context and tools','It returns only a final summary or a structured result','Async sub-agents run in the background; the main agent checks, steers, or cancels them'],
 design:['Sync for short tasks, async for long ones, scripted fan-out for many items','Specific descriptions so the right sub-agent gets picked','Structured results that are easy to merge'],
 risks:[['Errors compounding across agents','verify sub-agent results'],['Cost blowups from fan-out','cap parallelism and budgets'],['Missing context in the hand-off','pass the needed facts explicitly in the task']]},
all:{name:'Use it as a checklist',sub:'Click any block to see how it works',
 how:['Map each block to how your framework implements it','Mark which blocks come built in and which you must add','The missing blocks are where production failures usually happen'],
 design:['Security lives in three places: input, action, and output','Memory needs both a write path and a recall path','Context is a budget: assemble, compress, isolate'],
 risks:[['Shipping without evals','you can’t tell if changes help'],['Shipping without guardrails','one injected instruction can trigger real actions'],['Shipping without durability','long runs fail and start over']]}

var S=[
{n:['entry'],e:null,d:'entry'},
{n:['ctx'],e:'e1',d:'ctx'},
{n:['model'],e:'e2',d:'model'},
{n:['ctrl'],e:'e3',d:'ctrl'},
{n:['guard'],e:'e4',d:'guard'},
{n:['act','tools','code','fs','sub'],e:'e5',d:'act'},
{n:['cm'],e:'e6',d:'cm'},
{n:['state'],e:'e7',d:'state'},
{n:['model'],e:'e8',d:'loop'},
{n:['out'],e:'e9',d:'out'},
{n:['obs'],e:'e10',d:'obs'},
{n:['ctx'],e:'e11',d:'improve'},
{n:['rt'],e:null,d:'rt'},
{n:null,e:null,d:'all'}
];
var ALL=['entry','ctx','instr','mem','skills','toolspec','hist','model','ctrl','guard','act','tools','code','fs','sub','cm','state','out','obs','rt'];
var ADJ={entry:['e1'],ctx:['e1','e2','e11'],instr:['e2'],mem:['e2'],skills:['e2'],toolspec:['e2'],hist:['e2'],model:['e2','e3','e8'],ctrl:['e3','e4'],guard:['e4','e5','e9'],act:['e5','e6'],tools:['e5','e6'],code:['e5','e6'],fs:['e5','e6'],sub:['e5','e6'],cm:['e6','e7'],state:['e7','e8'],out:['e9','e10'],obs:['e10','e11'],rt:[]};
var ORDER=['entry','ctx','instr','mem','skills','toolspec','hist','model','ctrl','guard','act','tools','code','fs','sub','cm','state','out','obs','rt'];
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(id){return document.getElementById(id)};
var comet=$('comet'),cd=comet.querySelectorAll('circle'),flow=$('flow'),pulse=$('pulse'),panel=$('panel');
var last=S.length-1,mode='explore',sel=null,cur=-1,box=null,curEdge=null,stepStart=performance.now(),tourI=0,MOVE=500,HOLD=9000,raf;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function ease(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2}
function fill(key,num){var d=D[key];
  $('pnum').textContent=num||'';$('pname').textContent=d.name;$('psub').textContent=d.sub;
  $('ph').innerHTML=d.how.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
  $('pd').innerHTML=d.design.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
  $('pr').innerHTML=d.risks.map(function(x){return '<li><span class="rk">'+esc(x[0])+'</span> → '+esc(x[1])+'</li>'}).join('');}
function clearAll(){document.querySelectorAll('.nd').forEach(function(g){g.classList.remove('on','lit')});document.querySelectorAll('.ln').forEach(function(l){l.classList.remove('on','seen')})}
function select(key){
  mode='explore';cur=-1;$('bPlay').classList.remove('on');$('bPlay').textContent='Play tour';
  clearAll();sel=key;curEdge=null;
  if(key==='all'){fill('all','');box=null;$('cnt').textContent='';return}
  $('n-'+key).classList.add('on');(ADJ[key]||[]).forEach(function(e){$(e).classList.add('seen')});
  if(key==='act')['tools','code','fs','sub'].forEach(function(n){$('n-'+n).classList.add('lit')});
  if(key==='ctx')['instr','mem','skills','toolspec','hist'].forEach(function(n){$('n-'+n).classList.add('lit')});
  fill(key,'');box=$('n-'+key).dataset.b.split(',').map(Number);
  var idx=ORDER.indexOf(key);$('cnt').textContent=(idx+1<10?'0':'')+(idx+1)+' / '+ORDER.length;
}
function setStep(i){
  if(i===cur)return;cur=i;var s=S[i];clearAll();
  for(var j=0;j<i;j++){if(S[j].e)$(S[j].e).classList.add('seen');if(S[j].n)S[j].n.forEach(function(n){$('n-'+n).classList.add('lit')})}
  if(i>=last-1)S.forEach(function(x){if(x.e)$(x.e).classList.add('seen')});
  (i===last?ALL:s.n).forEach(function(n){$('n-'+n).classList.add('on')});
  curEdge=s.e;if(s.e){$(s.e).classList.add('on');flow.setAttribute('d',$(s.e).getAttribute('d'))}
  fill(s.d,(i+1<10?'0':'')+(i+1));$('cnt').textContent=(i+1<10?'0':'')+(i+1)+' / '+S.length;
  box=s.n?$('n-'+s.n[0]).dataset.b.split(',').map(Number):null;
}
function draw(k,t){
  var ke=ease(Math.min(1,k)),e=mode==='tour'?curEdge:null;
  if(e&&k<1){var p=$(e),L=p.getTotalLength();comet.setAttribute('opacity',1);
    for(var c=0;c<cd.length;c++){var kk=Math.max(0,ke-(cd.length-1-c)*0.06),pt=p.getPointAtLength(L*kk);cd[c].setAttribute('cx',pt.x);cd[c].setAttribute('cy',pt.y)}
  }else comet.setAttribute('opacity',0);
  flow.setAttribute('opacity',e&&k>=1?.9:0);flow.setAttribute('stroke-dashoffset',-(t*0.03)%16);
  var arrived=!e||k>=1,ph=(t%2400)/2400,gr=ph*8;
  if(arrived&&box&&!reduceMotion){pulse.setAttribute('x',box[0]-gr);pulse.setAttribute('y',box[1]-gr);pulse.setAttribute('width',box[2]+2*gr);pulse.setAttribute('height',box[3]+2*gr);pulse.setAttribute('opacity',(1-ph)*.8)}
  else pulse.setAttribute('opacity',0);
  panel.style.opacity=mode==='tour'?.35+.65*Math.min(1,(e?k:k+.6)*1.6):1;
}
function tour(i){mode='tour';tourI=(i+S.length)%S.length;stepStart=performance.now();setStep(tourI)}
function loop(now){
  var el=now-stepStart;
  if(mode==='tour'&&!reduceMotion&&el>MOVE+(tourI===last?10000:HOLD)){tour(tourI+1);el=0}
  draw(mode==='tour'&&!reduceMotion?el/MOVE:1,reduceMotion?0:now);raf=requestAnimationFrame(loop);
}
function step(d){
  if(mode==='tour'){tour(tourI+d);return}
  var idx=sel&&sel!=='all'?ORDER.indexOf(sel):-1;select(ORDER[(idx+d+ORDER.length)%ORDER.length]);
}
document.querySelectorAll('.nd').forEach(function(g){g.addEventListener('click',function(ev){ev.stopPropagation();select(g.id.slice(2))})});
$('bOverview').addEventListener('click',function(){select('all')});
$('bPrev').addEventListener('click',function(){step(-1)});
$('bNext').addEventListener('click',function(){step(1)});
$('bPlay').addEventListener('click',function(){if(mode==='tour'){var sn=S[tourI].n;select(sn?sn[0]:'all')}else{tour(0);this.classList.add('on');this.textContent='Stop tour'}});
window.addEventListener('keydown',function(ev){if(ev.key==='ArrowRight')step(1);if(ev.key==='ArrowLeft')step(-1);if(ev.key==='Escape')select('all')});

window.addEventListener('resize',fit);

window.__select=function(key){cancelAnimationFrame(raf);$('frame').style.transform='none';select(key);draw(1,0)};
window.__steps=S.length;window.__edges=S.map(function(s){return !!s.e});
select('all');fit();raf=requestAnimationFrame(loop);
