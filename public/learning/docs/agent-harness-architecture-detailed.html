<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent harness: memory-aware architecture</title>
<style>
:root{
  --bg:#FFFFFF;--surface:#F6F5F1;--code-bg:#FFFFFF;--border:#DCDAD2;--border-strong:#B4B2A9;--line:#8A8880;
  --text:#2C2C2A;--text-2:#5F5E5A;--accent-bg:#E6F1FB;--accent-border:#185FA5;--accent-text:#0C447C;--warning:#A15C00;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1C1B;--surface:#262624;--code-bg:#1C1C1B;--border:#3A3936;--border-strong:#55534E;--line:#9C9A92;
  --text:#ECEAE3;--text-2:#B4B2A9;--accent-bg:#0C2A47;--accent-border:#85B7EB;--accent-text:#B5D4F4;--warning:#FAC775;color-scheme:dark
}}
:root[data-theme="dark"]{
  --bg:#1C1C1B;--surface:#262624;--code-bg:#1C1C1B;--border:#3A3936;--border-strong:#55534E;--line:#9C9A92;
  --text:#ECEAE3;--text-2:#B4B2A9;--accent-bg:#0C2A47;--accent-border:#85B7EB;--accent-text:#B5D4F4;--warning:#FAC775;color-scheme:dark
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:hidden;font-family:"Inter",system-ui,-apple-system,"Segoe UI","Helvetica Neue","Liberation Sans",Arial,sans-serif}
#frame{width:1200px;height:1215px;flex:none;transform-origin:top center;position:relative;background:var(--bg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:.6;pointer-events:none}
svg{display:block;width:1200px;height:800px;position:absolute;left:0;top:0}
.nd{cursor:pointer}
.box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1}
.nd:hover .box,.nd:hover .cont,.nd:hover .chipr{stroke:var(--accent-border)}
.nd.on .box{fill:var(--accent-bg);stroke:var(--accent-border);stroke-width:1.8;filter:url(#glow)}
.nd.lit .box,.nd.lit .chipr{stroke:var(--accent-border)}
.cont{fill:transparent;stroke:var(--border-strong);stroke-width:1;stroke-dasharray:4 4}
.nd.on .cont{stroke:var(--accent-border);stroke-width:1.5}
.loopf{fill:color-mix(in srgb,var(--accent-bg) 25%,transparent);stroke:var(--border-strong);stroke-width:1.2;stroke-dasharray:6 5}
.nd.on .loopf{stroke:var(--accent-border);stroke-width:1.8}
.chipr{fill:var(--surface);stroke:var(--border-strong);stroke-width:.8}
.nd.on .chipr{fill:var(--accent-bg);stroke:var(--accent-border);stroke-width:1.6;filter:url(#glow)}
.mt .box{stroke:var(--border-strong)}
.mt.on .box{stroke:var(--warning);fill:var(--accent-bg)}
.det .chipr{stroke:var(--border-strong)}
.mst .box{fill:var(--surface);stroke:var(--border-strong)}
.mst.on .box{fill:var(--accent-bg);stroke:var(--accent-border)}
.mst.lit .box{stroke:var(--accent-border)}
.tt{font-size:15px;font-weight:700;fill:var(--text)}
.t13{font-size:13px;font-weight:700;fill:var(--text)}
.st{font-size:11.5px;fill:var(--text-2);font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.li{font-size:13px;fill:var(--text)}
.ct{font-size:12.5px;fill:var(--text)}
.nd.on .st,.nd.on .li{fill:var(--accent-text)}
.nd.on .ct{fill:var(--text)}
.mst .st{fill:var(--text-2)}
.mt .st{fill:var(--warning)}
.lab{font-size:12px;fill:var(--text-2)}
.ln{stroke:var(--line);stroke-width:1.3;fill:none}
.ln.seen{stroke:var(--accent-border);stroke-width:1.8}
.ln.on{stroke:var(--accent-border);stroke-width:2.6}
.ln.mem{stroke:var(--line);stroke-dasharray:5 4}
.ln.mem.seen{stroke:var(--accent-border)}
.ln.mem.on{stroke:var(--accent-border);stroke-width:2.6}
.h1{font-size:30px;font-weight:700;fill:var(--text);letter-spacing:-0.015em}
.cnt{font-size:18px;fill:var(--accent-border);font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.lg{font-size:12px;fill:var(--text-2)}
#panel{position:absolute;left:40px;right:40px;top:806px;height:385px;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:18px 22px;overflow:hidden}
#panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--accent-border));box-shadow:0 0 12px var(--acc,var(--accent-border))}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;row-gap:2px;margin-bottom:12px;padding-right:330px}
#psub{flex-basis:100%}
.noctrl .ph{padding-right:0}
#pnum{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:20px;color:var(--accent-border)}
#pname{font-size:23px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
#psub{font-size:15px;color:var(--text-2)}
#ptag{font-size:12px;border:1px solid var(--acc,var(--accent-border));color:var(--acc,var(--accent-border));border-radius:999px;padding:1px 9px;white-space:nowrap}
.cols{display:grid;grid-template-columns:1.05fr 1fr 1.15fr;gap:22px}
.col h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--accent-border)}
.col ol,.col ul{margin:0;padding-left:20px;font-size:14px;line-height:1.5;color:var(--text)}
.col li{margin-bottom:5px}
.col li::marker{color:var(--accent-border)}
.rk{color:var(--warning)}
.ctrl{position:absolute;right:58px;top:820px;display:flex;gap:8px;z-index:2}
.ctrl button{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:5px 11px;cursor:pointer}
.ctrl button:hover{border-color:var(--accent-border)}
.ctrl button:focus-visible{outline:2px solid var(--accent-border);outline-offset:2px}
.ctrl button.on{border-color:var(--accent-border);color:var(--accent-border)}
</style>
</head>

<title id="t">Memory-aware agent harness</title>
<desc id="d">A reference agent harness merged with a memory-aware agent design: memory is read before the agent loop, managed and offloaded inside it, and written after it, through a memory manager over typed memory stores.</desc>

<script>
var D={
all:{name:'Overview',tag:'the whole picture',sub:'Memory operations before, inside, and after the loop',

var TAGC={'memory store':'var(--accent-border)','agent-triggered':'var(--warning)'};

function step(d){
  if(mode==='tour'){tour(tourI+d);return}
  var idx=sel&&sel!=='all'?ORDER.indexOf(sel):-1;select(ORDER[(idx+d+ORDER.length)%ORDER.length]);
}
document.querySelectorAll('.nd').forEach(function(g){g.addEventListener('click',function(ev){ev.stopPropagation();var id=g.id.slice(2);select(ALIAS[id]||id)})});
$('bOverview').addEventListener('click',function(){select('all')});
$('bPrev').addEventListener('click',function(){step(-1)});
$('bNext').addEventListener('click',function(){step(1)});
$('bPlay').addEventListener('click',function(){if(mode==='tour'){var sn=S[tourI].n;select(sn?(ALIAS[sn[0]]||sn[0]):'all')}else{tour(0);this.classList.add('on');this.textContent='Stop tour'}});
window.addEventListener('keydown',function(ev){if(ev.key==='ArrowRight')step(1);if(ev.key==='ArrowLeft')step(-1);if(ev.key==='Escape')select('all')});
function fit(){var sc=Math.min(window.innerWidth/1200,window.innerHeight/1215);$('frame').style.transform='scale('+sc+')'}
window.addEventListener('resize',fit);
window.__frame=function(stp,k,t){cancelAnimationFrame(raf);$('frame').style.transform='none';$('ctrl').style.display='none';$('frame').classList.add('noctrl');mode='tour';curEdge=null;cur=-1;setStep(stp);draw(k,t)};
window.__select=function(key){cancelAnimationFrame(raf);$('frame').style.transform='none';select(key);draw(1,0)};
window.__steps=S.length;window.__edges=S.map(function(s){return !!s.e});
select('all');fit();raf=requestAnimationFrame(loop);
</script>
</body>
</html>
